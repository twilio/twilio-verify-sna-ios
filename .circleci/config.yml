version: 2.1

jobs:
  build-and-test:
    macos:
      xcode: 16.0.0
    steps:
      - checkout
      - run:
          name: Build SDK
          command: ./scripts/build.sh
      - run:
          name: Run Unit Tests
          command: ./scripts/test.sh test-results
      - run:
          name: Generate Code Coverage
          command: ./scripts/coverage.sh coverage-results
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage-results
          destination: coverage

  sdk-size:
    macos:
      xcode: 16.0.0
    steps:
      - checkout
      - run:
          name: Measure SDK Size
          command: ./scripts/sdk-size.sh
      - store_artifacts:
          path: sizes.txt
          destination: sdk-size-report

workflows:
  build:
    jobs:
      - build-and-test
      - sdk-size:
          requires:
            - build-and-test
