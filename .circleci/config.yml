version: 2.1

jobs:
  build-and-analyze:
    macos:
      xcode: 16.0.0  # Closest to macos-14 runner's Xcode; adjust if needed
    environment:
      scheme: TwilioVerifySNA
    steps:
      - checkout
      - run:
          name: Build and Analyze default scheme using xcodebuild
          command: |
            if [ "$scheme" = "default" ]; then scheme=$(cat default); fi
            if [ "$(ls -A | grep -i \.xcworkspace$)" ]; then
              filetype_parameter="workspace"
              file_to_build="$(ls -A | grep -i \.xcworkspace$)"
            else
              filetype_parameter="project"
              file_to_build="$(ls -A | grep -i \.xcodeproj$)"
            fi
            file_to_build=$(echo $file_to_build | awk '{$1=$1;print}')
            xcodebuild clean build \
              -scheme "$scheme" \
              -"$filetype_parameter" "$file_to_build" | xcpretty
            exit ${PIPESTATUS[0]}
      - run:
          name: Run Unit Tests for TwilioVerifySNA
          command: |
            swift test --package-path TwilioVerifySNA

workflows:
  build:
    jobs:
      - build-and-analyze